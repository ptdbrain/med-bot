services:
  backend:
    build:
      context: .
      args:
        INSTALL_AUDIO: ${INSTALL_AUDIO:-false}
        INSTALL_RAG: ${INSTALL_RAG:-false}
        INSTALL_FRONTEND: "false"
    env_file:
      - .env.example
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-512}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-lexical}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-8}
      HF_HOME: /root/.cache/huggingface
      VECTOR_STORE_PROVIDER: ${VECTOR_STORE_PROVIDER:-memory}
      DENSE_INDEX_PATH: ${DENSE_INDEX_PATH:-data/indexes/dense_vectors.db}
      DENSE_WRITE_BATCH_SIZE: ${DENSE_WRITE_BATCH_SIZE:-64}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-medtutor_chunks}
      CHUNK_SIZE: ${CHUNK_SIZE:-900}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-120}
      CHUNK_MIN_SIZE: ${CHUNK_MIN_SIZE:-180}
      HYBRID_CANDIDATE_MULTIPLIER: ${HYBRID_CANDIDATE_MULTIPLIER:-4}
      HYBRID_RRF_K: ${HYBRID_RRF_K:-60}
      HYBRID_DENSE_WEIGHT: ${HYBRID_DENSE_WEIGHT:-1.0}
      HYBRID_SPARSE_WEIGHT: ${HYBRID_SPARSE_WEIGHT:-1.0}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-lexical}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANKER_CANDIDATE_K: ${RERANKER_CANDIDATE_K:-20}
      RERANKER_BATCH_SIZE: ${RERANKER_BATCH_SIZE:-8}
      RERANKER_DIVERSITY_LAMBDA: ${RERANKER_DIVERSITY_LAMBDA:-0.75}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      args:
        INSTALL_AUDIO: ${INSTALL_AUDIO:-false}
        INSTALL_RAG: "false"
        INSTALL_FRONTEND: "true"
    command: streamlit run frontend/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      - backend

  qdrant:
    image: qdrant/qdrant:v1.9.2
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
  hf_cache:
