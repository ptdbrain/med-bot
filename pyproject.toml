[project]
name = "medtutor-rag-copilot"
version = "0.1.0"
description = "Medical education RAG copilot with citations and safety guardrails."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.7.0",
  "python-multipart>=0.0.9",
  "streamlit>=1.34.0",
  "requests>=2.31.0",
  "pypdf>=4.2.0",
  "python-docx>=1.1.0",
  "qdrant-client>=1.9.0",
  "rank-bm25>=0.2.2",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "httpx2>=2.0.0",
  "ruff>=0.4.0",
  "black>=24.4.0",
]
audio = ["faster-whisper>=1.0.3"]
rag = ["sentence-transformers>=3.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]

[tool.black]
line-length = 120
target-version = ["py311"]
